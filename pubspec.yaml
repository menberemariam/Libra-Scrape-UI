name: libra_scrape
description: "LibraScrape - Your Free Digital Library"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # State Management
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  
  # UI & Navigation
  go_router: ^12.1.3
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Animations & Modern UI
  lottie: ^3.0.0
  animate_do: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  flutter_animate: ^4.3.0
  page_transition: ^2.1.0
  smooth_page_indicator: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  card_swiper: ^3.0.1
  
  # Storage & Caching
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.2
  path_provider: ^2.1.2
  permission_handler: ^11.1.0
  connectivity_plus: ^5.0.2
  
  # Audio Player & Media
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  audio_video_progress_bar: ^2.0.1
  
  # UI Enhancements
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
  
  # Custom fonts (optional - using system fonts for now)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
