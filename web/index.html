<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Libra is a free digital library of classic books and audiobooks. Read or download thousands of public-domain titles.">
  <meta name="theme-color" content="#312E81">
  <meta property="og:title" content="Libra — Free Digital Library">
  <meta property="og:description" content="Read, listen and keep thousands of classic books and audiobooks — free, forever.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Libra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Libra — Free Digital Library</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #F6F7FB;
      height: 100%;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 55%, #4338CA 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 350ms ease;
      z-index: 9999;
    }
    #splash .mark {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #FCD34D;
      font-size: 30px;
    }
    #splash .name {
      color: #fff;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    #splash .tag {
      color: rgba(255, 255, 255, 0.62);
      font-size: 11px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
    }
    #splash .bar {
      width: 92px;
      height: 3px;
      margin-top: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }
    #splash .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #FCD34D;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="mark">&#128218;</div>
    <div class="name">Libra</div>
    <div class="tag">Free Digital Library</div>
    <div class="bar"><span></span></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
</body>
</html>
